services:

  postgres:
    image: postgres:16-alpine
    container_name: image-cdn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imagecdn
      POSTGRES_PASSWORD: imagecdn_password
      POSTGRES_DB: imagecdn
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: image-cdn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mahi
      MINIO_ROOT_PASSWORD: your-long-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: image-cdn-redis
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: